name: Build MobileGuard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/mobileguard
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MobileGuard"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mobileguard"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.mobileguard"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.camera:camera-core:1.4.2")
              implementation("androidx.camera:camera-camera2:1.4.2")
              implementation("androidx.camera:camera-lifecycle:1.4.2")
              implementation("androidx.camera:camera-view:1.4.2")
              implementation("com.google.mlkit:face-detection:16.1.7")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera.front" android:required="false"/>

              <application
                  android:allowBackup="false"
                  android:label="MobileGuard"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MobileGuard</string>
          </resources>
          EOF

          cat > app/src/main/java/com/mobileguard/MainActivity.kt <<'EOF'
          package com.mobileguard

          import android.Manifest
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import java.util.concurrent.Executors

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { getSharedPreferences("mg", MODE_PRIVATE) }
              private var audio: Uri? = null
              private var player: MediaPlayer? = null
              private var provider: ProcessCameraProvider? = null
              private val executor = Executors.newSingleThreadExecutor()
              private var status: TextView? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun showHome() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(22, 25, 22, 20)
                      setBackgroundColor(Color.rgb(16, 19, 27))
                  }

                  fun addText(s: String, size: Float = 18f) {
                      box.addView(TextView(this).apply {
                          text = s
                          textSize = size
                          setTextColor(Color.WHITE)
                          setPadding(0, 12, 0, 12)
                      })
                  }

                  fun addButton(s: String, action: () -> Unit) {
                      box.addView(Button(this).apply {
                          text = s
                          setOnClickListener { action() }
                      })
                  }

                  addText("MOBILEGUARD", 28f)
                  addText("Offline camera face detection")
                  addButton("RED ADMIN PANEL") { admin() }
                  addButton("SELECT AUDIO") { selectAudio() }
                  addButton("TEST REPEATING ALARM") { startAlarm() }
                  addButton("STOP ALARM") { stopAlarm() }
                  addButton("START FACE SCAN") { requestCamera() }
                  addText("Face scan detects faces only. It does not identify who the person is.")
                  setContentView(box)
              }

              private fun admin() {
                  val input = EditText(this).apply {
                      hint = "RED password"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  AlertDialog.Builder(this)
                      .setTitle("RED Admin")
                      .setView(input)
                      .setPositiveButton("Unlock") { _, _ ->
                          val old = prefs.getString("password", null)
                          val entered = input.text.toString()
                          if (old == null && entered.length >= 6) {
                              prefs.edit().putString("password", entered).apply()
                              toast("Password created")
                          } else if (old == entered) {
                              toast("Admin unlocked")
                          } else {
                              toast("Wrong password or minimum 6 characters required")
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun selectAudio() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      type = "audio/*"
                      addCategory(Intent.CATEGORY_OPENABLE)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(i, 10)
              }

              @Deprecated("Legacy document picker callback")
              override fun onActivityResult(r: Int, c: Int, data: Intent?) {
                  super.onActivityResult(r, c, data)
                  if (r == 10 && c == RESULT_OK) {
                      audio = data?.data
                      audio?.let {
                          try {
                              contentResolver.takePersistableUriPermission(it, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          } catch (_: Exception) {}
                          prefs.edit().putString("audio", it.toString()).apply()
                          toast("Audio selected")
                      }
                  }
              }

              private fun getAudio(): Uri? =
                  audio ?: prefs.getString("audio", null)?.let { Uri.parse(it) }

              private fun startAlarm() {
                  stopAlarm()
                  val uri = getAudio()
                  if (uri == null) {
                      toast("Select audio first")
                      return
                  }
                  try {
                      player = MediaPlayer().apply {
                          setDataSource(this@MainActivity, uri)
                          isLooping = true
                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      toast("Audio error: ${e.message}")
                  }
              }

              private fun stopAlarm() {
                  try { player?.stop() } catch (_: Exception) {}
                  try { player?.release() } catch (_: Exception) {}
                  player = null
              }

              private fun requestCamera() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 20)
                  }
              }

              override fun onRequestPermissionsResult(
                  r: Int, p: Array<out String>, g: IntArray
              ) {
                  super.onRequestPermissionsResult(r, p, g)
                  if (r == 20 && g.isNotEmpty() && g[0] == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  }
              }

              private fun startCamera() {
                  val previewView = PreviewView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(12, 12, 12, 12)
                      setBackgroundColor(Color.BLACK)
                  }
                  root.addView(TextView(this).apply {
                      text = "MobileGuard Live Camera"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                  })
                  root.addView(previewView, LinearLayout.LayoutParams(-1, 0, 1f))
                  status = TextView(this).apply {
                      text = "Starting camera..."
                      textSize = 18f
                      setTextColor(Color.WHITE)
                  }
                  root.addView(status)
                  root.addView(Button(this).apply {
                      text = "STOP SCAN"
                      setOnClickListener {
                          provider?.unbindAll()
                          showHome()
                      }
                  })
                  setContentView(root)

                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          provider = future.get()
                          val preview = Preview.Builder().build().also {
                              it.setSurfaceProvider(previewView.surfaceProvider)
                          }
                          val detector = FaceDetection.getClient(
                              FaceDetectorOptions.Builder()
                                  .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                                  .build()
                          )
                          val analysis = ImageAnalysis.Builder()
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()

                          analysis.setAnalyzer(executor) { proxy ->
                              val media = proxy.image
                              if (media == null) {
                                  proxy.close()
                              } else {
                                  val image = InputImage.fromMediaImage(
                                      media, proxy.imageInfo.rotationDegrees
                                  )
                                  detector.process(image)
                                      .addOnSuccessListener { faces ->
                                          runOnUiThread {
                                              status?.text = if (faces.isEmpty())
                                                  "No face detected"
                                              else "Faces detected: ${faces.size} — identity not checked"
                                          }
                                      }
                                      .addOnFailureListener {
                                          runOnUiThread { status?.text = "Detection error" }
                                      }
                                      .addOnCompleteListener { proxy.close() }
                              }
                          }

                          provider?.unbindAll()
                          provider?.bindToLifecycle(
                              this,
                              CameraSelector.DEFAULT_FRONT_CAMERA,
                              preview,
                              analysis
                          )
                      } catch (e: Exception) {
                          toast("Camera error: ${e.message}")
                          showHome()
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun toast(s: String) =
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              override fun onStop() {
                  provider?.unbindAll()
                  super.onStop()
              }

              override fun onDestroy() {
                  provider?.unbindAll()
                  stopAlarm()
                  executor.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
